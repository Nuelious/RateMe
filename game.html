<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RateMe — Personality Game</title>

<link id="theme-stylesheet" rel="stylesheet" href="css/theme_dark.css">
<link id="card-stylesheet" rel="stylesheet" href="css/card_default.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://pl30760076.effectivecpmnetwork.com/d7/1c/9b/d71c9bb5837669588af2d9a78eeacb95.js"></script>

</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <div class="app-logo">
      <i class="fa-solid fa-star"></i>
      <span>RateMe</span>
    </div>
    <div class="header-actions">
      <a href="results.html" class="icon-btn" aria-label="Back to results"><i class="fa-solid fa-chart-simple"></i></a>
      <button id="settings-toggle" class="icon-btn" type="button" aria-label="Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </div>
</header>

<main class="page-container game-page">

  <div id="no-profile-state" class="state-panel hidden">
    <i class="fa-solid fa-id-card state-icon-error"></i>
    <p>You haven't created a profile yet.</p>
    <a href="index.html" class="btn btn-primary">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Create Your Profile
    </a>
  </div>

<div id="container-623e65e91d9ef44b769dff87a9409b60"></div>


  <div id="game-locked-state" class="state-panel hidden">
    <i class="fa-solid fa-lock state-icon-error"></i>
    <h2>Game Locked</h2>
    <p>Get 8 ratings to unlock the Personality Game.</p>
    <p id="game-locked-count" class="locked-count-label"></p>
    <div id="game-locked-share" style="max-width:400px;margin:16px auto;"></div>
    <a href="results.html" class="btn btn-primary">
      <i class="fa-solid fa-share"></i> Back to Results
    </a>
  </div>

<div id="container-623e65e91d9ef44b769dff87a9409b60"></div>


  <div id="game-container" class="game-container">

    <div id="game-start-screen" class="themed-card game-start-screen hidden">
      <i class="fa-solid fa-gamepad game-start-icon"></i>
      <h1>Personality Game</h1>
      <p>Test how well you know your own results! Answer <span id="game-total-questions">0</span> questions about your ratings.</p>
      <button id="start-game-btn" class="btn btn-primary btn-lg" type="button">
        <i class="fa-solid fa-play"></i> Start Game
      </button>
    </div>

    <div id="game-play-screen" class="game-play-screen hidden">
      <div class="rate-progress-track">
        <div id="game-progress-bar" class="rate-progress-bar"></div>
      </div>
      <span id="game-progress-label" class="rate-progress-label"></span>

      <div id="game-question-stage" class="themed-card game-question-stage"></div>
    </div>

    <div id="game-results-screen" class="game-results-screen hidden">
      <div class="themed-card game-score-card">
        <i class="fa-solid fa-medal game-score-icon"></i>
        <h2 id="game-final-score">0 / 0</h2>
        <p id="game-final-percentage">0%</p>
        <p id="game-result-message" class="game-result-message"></p>
        <button id="play-again-btn" class="btn btn-primary" type="button">
          <i class="fa-solid fa-rotate-right"></i> Play Again
        </button>
      </div>

      <div class="themed-card game-review-card">
        <h3><i class="fa-solid fa-list-check"></i> Review</h3>
        <div id="game-review-list" class="game-review-list"></div>
      </div>
    </div>

  </div>
</main>

<script async="async" data-cfasync="false" src="https://pl30760080.effectivecpmnetwork.com/623e65e91d9ef44b769dff87a9409b60/invoke.js"></script>
<div id="container-623e65e91d9ef44b769dff87a9409b60"></div>


<div id="settings-overlay" class="settings-overlay"></div>
<aside id="settings-panel" class="settings-panel">
  <div class="settings-panel-header">
    <h2><i class="fa-solid fa-gear"></i> Settings</h2>
    <button id="settings-close" class="icon-btn" type="button" aria-label="Close settings">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
  <div class="settings-panel-body">
    <div class="settings-block">
      <h3><i class="fa-solid fa-palette"></i> Theme</h3>
      <div id="theme-grid" class="swatch-grid theme-swatch-grid"></div>
    </div>
    <div class="settings-block">
      <h3><i class="fa-solid fa-square"></i> Card Style</h3>
      <div id="card-style-grid" class="swatch-grid card-swatch-grid"></div>
    </div>
  </div>
</aside>

<script type="module" src="js/main-game.js"></script>

<script src="https://pl30760079.effectivecpmnetwork.com/52/33/f2/5233f2efda9d0d00d9e399468dcd5db7.js"></script>

</body>
</html>
