<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RateMe — Settings</title>

<link id="theme-stylesheet" rel="stylesheet" href="css/theme_dark.css">
<link id="card-stylesheet" rel="stylesheet" href="css/card_default.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <div class="app-logo">
      <i class="fa-solid fa-star"></i>
      <span>RateMe</span>
    </div>
    <div class="header-actions">
      <a href="results.html" class="icon-btn" aria-label="Back to results"><i class="fa-solid fa-chart-simple"></i></a>
    </div>
  </div>
</header>

<main class="page-container settings-page">
  <div class="section-heading">
    <h1><i class="fa-solid fa-gear"></i> Settings</h1>
    <p>Customize your appearance and manage your profile.</p>
  </div>

  <div class="themed-card">
    <h3><i class="fa-solid fa-palette"></i> Theme</h3>
    <div id="theme-grid" class="swatch-grid theme-swatch-grid"></div>
  </div>

  <div class="themed-card">
    <h3><i class="fa-solid fa-square"></i> Card Style</h3>
    <div id="card-style-grid" class="swatch-grid card-swatch-grid"></div>
  </div>

  <div id="profile-settings-block" class="themed-card hidden">
    <h3><i class="fa-solid fa-user-pen"></i> Edit Profile</h3>
    <form id="settings-name-form" class="settings-inline-form">
      <input type="text" id="settings-name-input" placeholder="Your name" maxlength="40">
      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-check"></i> Save
      </button>
    </form>
  </div>

  <div id="danger-zone-block" class="themed-card danger-zone hidden">
    <h3><i class="fa-solid fa-triangle-exclamation"></i> Danger Zone</h3>
    <button id="settings-delete-btn" class="btn btn-danger btn-block" type="button">
      <i class="fa-solid fa-trash"></i> Delete Profile
    </button>
  </div>

  <div class="themed-card">
    <h3><i class="fa-solid fa-globe"></i> Explore</h3>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <a href="leaderboard.html" class="btn btn-ghost btn-block"><i class="fa-solid fa-trophy"></i> Leaderboard</a>
      <a href="about.html" class="btn btn-ghost btn-block"><i class="fa-solid fa-circle-info"></i> About Us</a>
      <a href="support.html" class="btn btn-ghost btn-block"><i class="fa-solid fa-heart"></i> Support Us</a>
      <a href="contact.html" class="btn btn-ghost btn-block"><i class="fa-solid fa-envelope"></i> Contact / Report Bug</a>
    </div>
  </div>
</main>

<div id="settings-overlay" class="settings-overlay" style="display:none;"></div>

<script type="module" src="js/main-settings.js"></script>
</body>
</html>
